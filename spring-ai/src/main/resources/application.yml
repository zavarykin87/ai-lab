spring:
  application:
    name: spring-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_ai_lab}
    username: ${DB_USERNAME:springai}
    password: ${DB_PASSWORD:springai}

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen3.5:9b}
        temperature: 0.7
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  mvc:
    async:
      request-timeout: 5m

server:
  port: 8080